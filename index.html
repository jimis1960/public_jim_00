<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Inputs Example</title>
  <link rel="stylesheet" href="../libs/global_styles.css">
</head>
<style>
  html,
  body {

    background-color: rgb(95, 89, 100);
  }

  label {
    font-size: large;
    font-family: 'Courier New', Courier, monospace;
    background-color: rgb(255, 255, 255);
  }

  #div1 {
    width: 400px;
    height: 100%;
    margin: 0 auto;
    padding: 20px;
    background-color: rgb(255, 255, 255);
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;


    font-size: large;
    color: rgb(0, 0, 0);
    border: 1px solid rgb(200, 200, 200);
    box-sizing: border-box;
  }

  input {
    height: 28px;
    font-size: large;
    font-family: 'Courier New', Courier, monospace;
    background-color: rgb(244, 244, 250);

  }

  #myDialog1 {
    background-color: rgb(244, 244, 250);
    width: 320px;
    display: none;
    flex-flow: column;
  }
</style>

<body>


  <div id="div1">

    <label for="text-input">Text Input:</label>
    <input type="text" id="text-input" name="text-input" placeholder="Enter text">

    <br>


    <label for="number-input">Number Input:</label>
    <input type="number" id="number-input" name="number-input" min="1" max="100" step="1" value="50">

    <br>
    <label for="color-input">Color Input:</label>
    <input type="color" id="color-input" name="color-input" value="#ff0000">

    <br>

    <label for="range-input">Range Input:</label>
    <input type="range" id="range-input" name="range-input" min="0" max="100" value="50">

    <br>

    <label for="checkbox-input">Checkbox Input:</label>
    <input type="checkbox" id="checkbox-input" name="checkbox-input" checked>

    <br>

    <label for="radio-input1">Radio Input 1:</label>


    <input type="radio" id="radio-input1" name="radio-group" checked>

    <label for="radio-input2">Radio Input 2:</label>
    <input type="radio" id="radio-input2" name="radio-group">

    <br>

    <label for="file-input">File Input:</label>
    <input type="file" id="file-input" name="file-input">

    <br>

    <br>
  </div>

  <div id="myDialog" class="divabs">
    <div style=" width:220px" class="divcol">
      <div class="divcol">
        <label>Enter text: </label>
        <textarea style="height:300px" id="w3review" name="w3review"></textarea>

      </div>
      <div class="divrow">
        <div class="item"> </div>

        <button class="item" onclick="myDialog(event)" value="cancel">Cancel</button>
        <button class="item" onclick="myDialog(event)" value="ok">OK_____</button>
      </div>
    </div>

  </div>

  <button id="openBtn">Open Dialog</button>

  <script>
    const dialog = document.getElementById('myDialog');
    dialog.style.display = 'none'


    document.getElementById('openBtn').addEventListener('click', () => {
      dialog.style.display = 'block';  
    });

    dialog.addEventListener('close', () => {
      alert(dialog.returnValue);
    });

    function myDialog(e) {
      el = e.target

      if (el.value == 'ok') { alert('ok') }
      dialog.style.display = 'none';
    }


  </script>

</body>

</html>
